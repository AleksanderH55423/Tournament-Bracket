<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tournament Bracket</title>
<style>
  :root {
    --bg: #14161c;
    --card: #1f232d;
    --card-hover: #2a3040;
    --border: #353b4b;
    --text: #e8eaf0;
    --muted: #9aa1b2;
    --accent: #f5b942;
    --win: #3ecf8e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; max-width: 760px; }
  button {
    background: var(--accent);
    color: #1a1a1a;
    border: 0;
    border-radius: 6px;
    padding: 10px 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .hidden { display: none !important; }

  /* ---------- Tournament log ---------- */
  button.danger { background: transparent; color: #ff9a9a; border: 1px solid #5c3b3f; }
  button.danger:hover:not(:disabled) { background: rgba(255, 120, 120, 0.1); filter: none; }
  .back { margin-bottom: 14px; }
  #tlist { margin-top: 16px; max-width: 940px; }
  .tcard {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .tcard:hover { background: var(--card-hover); }
  .tinfo { min-width: 0; }
  .tname { font-weight: 700; font-size: 17px; overflow-wrap: anywhere; }
  .tchamp { color: var(--accent); font-weight: 600; margin-top: 3px; overflow-wrap: anywhere; }
  .tmeta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .tbtns { display: flex; gap: 8px; flex-shrink: 0; }
  .empty-log {
    color: var(--muted);
    padding: 28px;
    border: 1px dashed var(--border);
    border-radius: 10px;
  }

  /* ---------- Setup ---------- */
  .namefield { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; max-width: 940px; }
  .namefield label { color: var(--muted); }
  .namefield input {
    flex: 1;
    padding: 8px 10px;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 15px;
  }
  .count { margin: 0 0 12px; color: var(--muted); }
  .count strong { color: var(--text); }
  .slot {
    display: grid;
    grid-template-columns: 28px 1fr 1.4fr auto 56px 34px;
    gap: 10px;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
    max-width: 940px;
  }
  .slot .num { color: var(--muted); font-weight: 700; text-align: center; }
  .slot input[type="text"] {
    width: 100%;
    padding: 8px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .slot input[type="file"] { color: var(--muted); max-width: 190px; font-size: 12px; }
  .slot .remove { padding: 6px 0; width: 34px; }
  .thumb {
    width: 48px; height: 48px;
    border-radius: 6px;
    object-fit: cover;
    background: var(--bg);
    border: 1px solid var(--border);
  }
  .actions { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }

  /* ---------- Bracket ---------- */
  .bracket {
    overflow-x: auto;
    padding-bottom: 16px;
  }
  /* Left half | Final | right half, laid out as one row of columns.
     width: max-content + auto margins centers it when it fits and scrolls when it doesn't. */
  .cols {
    position: relative;
    display: flex;
    gap: 40px;
    width: max-content;
    margin: 0 auto;
  }
  .lines {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
  }
  .lines path { fill: none; stroke-width: 2; stroke-linejoin: round; }
  .lines path.pending { stroke: #4a5266; }
  .lines path.done { stroke: var(--win); }
  .round {
    display: flex;
    flex-direction: column;
    min-width: 230px;
  }
  .round h3 {
    text-align: center;
    margin: 0 0 12px;
    color: var(--muted);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .round-body {
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    flex: 1;
    gap: 16px;
    padding-top: 18px; /* room for the Final's crown; applied to every column so alignment is unchanged */
  }
  .match {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .team {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 8px 10px;
    min-height: 62px;
    cursor: pointer;
    border-left: 4px solid transparent;
  }
  .team + .team { border-top: 1px solid var(--border); }
  .team:hover { background: var(--card-hover); }
  .team.empty { cursor: default; color: var(--muted); font-style: italic; }
  .team.empty:hover { background: transparent; }
  .team.empty.bye { opacity: 0.5; letter-spacing: 0.1em; }
  .team.winner { border-left-color: var(--win); background: rgba(62, 207, 142, 0.12); }
  .team.winner:hover { background: rgba(62, 207, 142, 0.18); }
  .team.loser { opacity: 0.45; }
  .team.locked { cursor: default; }
  .team img, .team .ph {
    width: 44px; height: 44px;
    border-radius: 6px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--bg);
    border: 1px solid var(--border);
  }
  .team .name { font-weight: 600; }
  .team .note { font-size: 12px; color: var(--muted); }
  .team .seed { color: var(--muted); font-size: 11px; }

  /* ---------- The gilded Final ---------- */
  .match.final {
    position: relative;
    overflow: visible; /* lets the crown sit on top of the card */
    border: 2px solid #d9aa3c;
    background: linear-gradient(145deg, #2e2817 0%, #1f232d 50%, #2e2817 100%);
    box-shadow: 0 0 0 1px rgba(255, 224, 138, 0.2), 0 0 6px rgba(245, 185, 66, 0.15);
  }
  .match.final .team:first-of-type { border-radius: 6px 6px 0 0; }
  .match.final .team:last-of-type { border-radius: 0 0 6px 6px; }
  .match.final .team + .team { border-top-color: rgba(217, 170, 60, 0.45); }
  .match.final .team:hover { background: rgba(245, 185, 66, 0.1); }
  .match.final .team.empty:hover { background: transparent; }
  .match.final .team.winner {
    border-left-color: var(--accent);
    background: rgba(245, 185, 66, 0.18);
  }
  .match.final .crown {
    position: absolute;
    left: 50%;
    top: -27px;
    width: 44px;
    height: 34px;
    transform: translateX(-50%);
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
    pointer-events: none;
  }
  .match.final .crown .body { fill: url(#crownGold); stroke: #8a6416; stroke-width: 1; stroke-linejoin: round; }
  .match.final .crown .jewel { fill: #fff3c4; stroke: #8a6416; stroke-width: 0.8; }

  .champion {
    text-align: center;
    margin: 0 auto 20px;
    padding: 16px;
    border: 2px solid var(--accent);
    border-radius: 10px;
    background: rgba(245, 185, 66, 0.08);
    max-width: 420px;
  }
  .champion img { width: 96px; height: 96px; border-radius: 10px; object-fit: cover; }
  .champion .crown { font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); }
  .champion .cname { font-size: 22px; font-weight: 700; }
</style>
</head>
<body>
  <button class="secondary back hidden" id="back">&larr; All tournaments</button>
  <h1 id="title">Tournaments</h1>
  <p class="sub" id="sub"></p>

  <!-- LOG VIEW -->
  <section id="log">
    <div class="actions"><button id="newTournament">+ New tournament</button></div>
    <div id="tlist"></div>
  </section>

  <!-- SETUP VIEW -->
  <section id="setup" class="hidden">
    <div class="namefield">
      <label for="tname">Tournament name</label>
      <input type="text" id="tname" maxlength="60" placeholder="Untitled tournament">
    </div>
    <p class="count" id="count"></p>
    <div id="slots"></div>
    <div class="actions">
      <button class="secondary" id="add">+ Add entry</button>
      <button id="generate">Generate bracket</button>
      <button class="secondary" id="fill">Fill with sample names</button>
    </div>
  </section>

  <!-- BRACKET VIEW -->
  <section id="bracketView" class="hidden">
    <div id="champion"></div>
    <div class="bracket" id="bracket"></div>
    <div class="actions">
      <button class="secondary" id="edit">Edit entries</button>
      <button class="secondary" id="clearPicks">Clear results</button>
      <button class="danger" id="deleteCurrent">Delete tournament</button>
    </div>
  </section>

<script>
  const MIN_ENTRIES = 2;
  const MAX_ENTRIES = 32;
  const DEFAULT_ENTRIES = 8;
  const STORAGE_KEY = "bracket-poc-v3";      // { seq, openId, tournaments: [...] }
  const OLD_STORAGE_KEY = "bracket-poc-v2";  // the earlier single-bracket version

  // ---------- State ----------
  // db: everything that gets saved. db.tournaments is the log.
  // state: the tournament that is currently open (null while on the log screen):
  //   id, name, nameEdited, created, updated
  //   entries: array of { name, note, photo } in seed order (entry 1 = top seed)
  //   picks[r][m]: index of the entry the user picked to win match m of round r, or null
  //   builtN: how many entries the current picks were built for (0 = needs rebuilding)
  //   started: whether the bracket has been generated
  let db = loadDb();
  let state = null;

  function blankEntry() { return { name: "", note: "", photo: "" }; }

  function newId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function displayName(t) {
    return (t.name || "").trim() || "Untitled tournament";
  }

  function createTournament() {
    db.seq = (db.seq || 0) + 1;
    const now = Date.now();
    const t = {
      id: newId(),
      name: `Tournament ${db.seq}`,
      nameEdited: false,
      created: now,
      updated: now,
      entries: Array.from({ length: DEFAULT_ENTRIES }, blankEntry),
      picks: [],
      builtN: 0,
      started: false,
    };
    db.tournaments.push(t);
    return t;
  }

  function validTournament(t) {
    return t && typeof t.id === "string" && Array.isArray(t.entries) && Array.isArray(t.picks);
  }

  function loadDb() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const d = raw ? JSON.parse(raw) : null;
      if (d && Array.isArray(d.tournaments)) {
        d.tournaments = d.tournaments.filter(validTournament);
        if (!d.tournaments.some(t => t.id === d.openId)) d.openId = null;
        d.seq = Math.max(d.seq || 0, d.tournaments.length);
        return d;
      }
      // One-time migration: bring over the single bracket from the earlier version.
      const old = JSON.parse(localStorage.getItem(OLD_STORAGE_KEY) || "null");
      if (old && Array.isArray(old.entries) && Array.isArray(old.picks) &&
          (old.started || old.entries.some(e => e.name || e.note || e.photo))) {
        const now = Date.now();
        return {
          seq: 1,
          openId: null,
          tournaments: [{
            id: newId(), name: "My first tournament", nameEdited: true,
            created: now, updated: now,
            entries: old.entries, picks: old.picks,
            builtN: old.builtN || 0, started: !!old.started,
          }],
        };
      }
    } catch (e) { /* fall through to an empty log */ }
    return { seq: 0, openId: null, tournaments: [] };
  }

  // touch = false for navigation-only saves, so "Updated" only changes when you edit something.
  function save(touch = true) {
    if (touch && state) state.updated = Date.now();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    } catch (e) {
      alert("Couldn't save (browser storage is full). Delete an old tournament or use smaller photos.");
    }
  }

  // ---------- Bracket logic ----------
  function nextPow2(n) {
    let p = 2;
    while (p < n) p *= 2;
    return p;
  }

  // Standard seeding order: [1, 8, 4, 5, 2, 7, 3, 6] for 8 so 1 meets 8, 4 meets 5, etc.
  // The best seeds therefore get the byes when the field isn't a power of two.
  function seedOrder(p) {
    let order = [1];
    while (order.length < p) {
      const n = order.length * 2;
      order = order.flatMap(s => [s, n + 1 - s]);
    }
    return order;
  }

  // Everything derived from the number of entries.
  function layout() {
    const n = state.entries.length;
    const p = nextPow2(n);
    const slots = seedOrder(p).map(seed => (seed <= n ? seed - 1 : null)); // null = bye
    return { n, p, rounds: Math.log2(p), slots };
  }

  function buildPicks(p) {
    const out = [];
    for (let size = p / 2; size >= 1; size /= 2) out.push(new Array(size).fill(null));
    return out;
  }

  // Who plays match m of round r? (entry index, or null for a bye / not decided yet)
  function participants(L, r, m) {
    if (r === 0) return [L.slots[2 * m], L.slots[2 * m + 1]];
    return [winner(L, r - 1, 2 * m), winner(L, r - 1, 2 * m + 1)];
  }

  // A round-1 match against a bye is won automatically by the other entry.
  function winner(L, r, m) {
    if (r === 0) {
      const [a, b] = participants(L, 0, m);
      if (a === null) return b;
      if (b === null) return a;
    }
    return state.picks[r][m];
  }

  function isByeMatch(L, m) {
    return participants(L, 0, m).includes(null);
  }

  // Clear any pick that no longer matches its participants (cascades forward).
  function sanitize(L) {
    for (let r = 1; r < state.picks.length; r++) {
      for (let m = 0; m < state.picks[r].length; m++) {
        if (!participants(L, r, m).includes(state.picks[r][m])) state.picks[r][m] = null;
      }
    }
  }

  function pickWinner(r, m, entryIdx) {
    const L = layout();
    if (entryIdx === null || (r === 0 && isByeMatch(L, m))) return;
    // clicking the current winner again undoes the pick
    state.picks[r][m] = state.picks[r][m] === entryIdx ? null : entryIdx;
    sanitize(L);
    save();
    renderBracket();
  }

  function roundName(r, L) {
    const left = L.rounds - r;
    if (left === 1) return "Final";
    if (left === 2) return "Semifinals";
    if (left === 3) return "Quarterfinals";
    return `Round of ${L.p / 2 ** r}`;
  }

  // ---------- Setup view ----------
  const slotsEl = document.getElementById("slots");
  const addBtn = document.getElementById("add");

  function entriesChanged() {
    // Seeds shifted or the size changed, so old results no longer apply.
    state.builtN = 0;
    state.started = false;
    save();
  }

  function updateCount() {
    const n = state.entries.length;
    const p = nextPow2(n);
    const byes = p - n;
    document.getElementById("count").innerHTML =
      `<strong>${n}</strong> entries &rarr; ${p}-slot bracket` +
      (byes ? ` (${byes} bye${byes === 1 ? "" : "s"} for the top seed${byes === 1 ? "" : "s"})` : " (no byes)");
    addBtn.disabled = n >= MAX_ENTRIES;
  }

  function renderSetup() {
    document.getElementById("tname").value = state.name;
    slotsEl.innerHTML = "";
    const canRemove = state.entries.length > MIN_ENTRIES;

    state.entries.forEach((e, i) => {
      const row = document.createElement("div");
      row.className = "slot";
      row.innerHTML = `
        <div class="num">${i + 1}</div>
        <input type="text" placeholder="Name" maxlength="40" value="">
        <input type="text" placeholder="Note (optional)" maxlength="80" value="">
        <input type="file" accept="image/*">
        <img class="thumb" alt="">
        <button class="secondary remove" title="Remove this entry">&times;</button>
      `;
      const [nameIn, noteIn] = row.querySelectorAll('input[type="text"]');
      const fileIn = row.querySelector('input[type="file"]');
      const thumb = row.querySelector(".thumb");
      const removeBtn = row.querySelector(".remove");

      nameIn.value = e.name;
      noteIn.value = e.note;
      if (e.photo) thumb.src = e.photo; else thumb.style.visibility = "hidden";
      removeBtn.disabled = !canRemove;

      nameIn.addEventListener("input", () => { e.name = nameIn.value; save(); });
      noteIn.addEventListener("input", () => { e.note = noteIn.value; save(); });
      fileIn.addEventListener("change", async () => {
        const file = fileIn.files[0];
        if (!file) return;
        e.photo = await shrinkImage(file, 200);
        thumb.src = e.photo;
        thumb.style.visibility = "visible";
        save();
      });
      removeBtn.addEventListener("click", () => {
        if (state.entries.length <= MIN_ENTRIES) return;
        state.entries.splice(i, 1);
        entriesChanged();
        renderSetup();
      });
      slotsEl.appendChild(row);
    });
    updateCount();
  }

  // Resize to a small JPEG so localStorage doesn't overflow.
  function shrinkImage(file, max) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.75));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // ---------- Bracket view ----------
  function entryLabel(i) {
    return state.entries[i].name.trim() || `Entry ${i + 1}`;
  }

  function teamEl(L, r, m, idx) {
    const el = document.createElement("div");
    if (idx === null) {
      el.className = "team empty" + (r === 0 ? " bye" : "");
      el.textContent = r === 0 ? "BYE" : "TBD";
      return el;
    }
    const e = state.entries[idx];
    const picked = winner(L, r, m);
    const locked = r === 0 && isByeMatch(L, m);
    el.className = "team" +
      (picked === idx ? " winner" : picked !== null ? " loser" : "") +
      (locked ? " locked" : "");
    const photo = e.photo
      ? `<img src="${e.photo}" alt="">`
      : `<div class="ph"></div>`;
    el.innerHTML = `
      ${photo}
      <div>
        <div class="seed">Seed ${idx + 1}</div>
        <div class="name"></div>
        <div class="note"></div>
      </div>`;
    // textContent (not innerHTML) so typed text can't inject markup
    el.querySelector(".name").textContent = entryLabel(idx);
    el.querySelector(".note").textContent = e.note;
    if (!locked) el.addEventListener("click", () => pickWinner(r, m, idx));
    return el;
  }

  function range(from, to) { // [from, to)
    return Array.from({ length: to - from }, (_, i) => from + i);
  }

  function buildMatch(L, r, m) {
    const [a, b] = participants(L, r, m);
    const match = document.createElement("div");
    match.className = "match";
    match.dataset.r = r;
    match.dataset.m = m;
    match.appendChild(teamEl(L, r, m, a));
    match.appendChild(teamEl(L, r, m, b));
    return match;
  }

  // Little gold crown that perches on the Final's top edge.
  const CROWN_SVG = `
    <svg class="crown" viewBox="0 0 44 34" aria-hidden="true">
      <defs>
        <linearGradient id="crownGold" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffe08a"/>
          <stop offset="0.55" stop-color="#f5b942"/>
          <stop offset="1" stop-color="#c58a1d"/>
        </linearGradient>
      </defs>
      <path class="body" d="M5 28 L2 9 L13 18 L22 4 L31 18 L42 9 L39 28 Z"/>
      <rect class="body" x="5" y="28" width="34" height="5" rx="1.5"/>
      <circle class="jewel" cx="2" cy="8" r="2.4"/>
      <circle class="jewel" cx="22" cy="3.5" r="2.8"/>
      <circle class="jewel" cx="42" cy="8" r="2.4"/>
      <circle class="jewel" cx="22" cy="23" r="2.2"/>
    </svg>`;

  // One column of matches. side: "L" (left half), "R" (right half) or "C" (the Final).
  function roundColumn(L, r, matchIdxs, side) {
    const col = document.createElement("div");
    col.className = "round";
    col.innerHTML = `<h3></h3><div class="round-body"></div>`;
    col.querySelector("h3").textContent = roundName(r, L);
    const body = col.querySelector(".round-body");
    matchIdxs.forEach(m => {
      const match = buildMatch(L, r, m);
      match.dataset.side = side;
      if (side === "C") {
        match.classList.add("final");
        match.insertAdjacentHTML("afterbegin", CROWN_SVG);
      }
      body.appendChild(match);
    });
    return col;
  }

  // Connector lines: each match links to the match it feeds in the next round.
  // Drawn from measured positions, so they follow whatever size the cards end up.
  const SVG_NS = "http://www.w3.org/2000/svg";

  function drawLines() {
    const cols = document.querySelector("#bracket .cols");
    if (!cols || !state) return;
    const svg = cols.querySelector("svg.lines");
    const L = layout();
    const origin = cols.getBoundingClientRect();

    const boxes = {};
    const matchEls = [...cols.querySelectorAll(".match")];
    matchEls.forEach(el => {
      const b = el.getBoundingClientRect();
      boxes[`${el.dataset.r}-${el.dataset.m}`] = {
        left: b.left - origin.left,
        right: b.right - origin.left,
        mid: b.top - origin.top + b.height / 2,
        side: el.dataset.side,
      };
    });

    const pending = [], done = [];
    matchEls.forEach(el => {
      const r = +el.dataset.r, m = +el.dataset.m;
      if (r >= L.rounds - 1) return; // the Final feeds nothing
      const child = boxes[`${r}-${m}`];
      const parent = boxes[`${r + 1}-${m >> 1}`];
      if (!child || !parent) return;
      const fromLeftSide = child.side === "L";
      const x1 = fromLeftSide ? child.right : child.left;
      const x2 = fromLeftSide ? parent.left : parent.right;
      const xm = (x1 + x2) / 2;
      const d = `M${x1} ${child.mid}H${xm}V${parent.mid}H${x2}`;
      (winner(L, r, m) !== null ? done : pending).push(d);
    });

    svg.innerHTML = "";
    [[pending, "pending"], [done, "done"]].forEach(([list, cls]) => {
      list.forEach(d => {
        const path = document.createElementNS(SVG_NS, "path");
        path.setAttribute("d", d);
        path.setAttribute("class", cls);
        svg.appendChild(path);
      });
    });
  }

  function renderBracket() {
    const L = layout();
    const bracketEl = document.getElementById("bracket");
    bracketEl.innerHTML = "";

    const cols = document.createElement("div");
    cols.className = "cols";
    const svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("class", "lines");
    cols.appendChild(svg); // first, so the cards sit on top of the lines

    const last = L.rounds - 1;
    // Left half: first half of each round's matches, earliest round on the far left
    for (let r = 0; r < last; r++) {
      const half = state.picks[r].length / 2;
      cols.appendChild(roundColumn(L, r, range(0, half), "L"));
    }
    // Center: the Final
    cols.appendChild(roundColumn(L, last, [0], "C"));
    // Right half: second half of each round's matches, mirrored (earliest round on the far right)
    for (let r = last - 1; r >= 0; r--) {
      const half = state.picks[r].length / 2;
      cols.appendChild(roundColumn(L, r, range(half, half * 2), "R"));
    }
    bracketEl.appendChild(cols);

    // Champion banner
    const champEl = document.getElementById("champion");
    const champ = winner(L, L.rounds - 1, 0);
    if (champ !== null) {
      const e = state.entries[champ];
      champEl.className = "champion";
      champEl.innerHTML = `
        <div class="crown">Champion</div>
        ${e.photo ? `<img src="${e.photo}" alt=""><br>` : ""}
        <div class="cname"></div>
        <div class="note"></div>`;
      champEl.querySelector(".cname").textContent = entryLabel(champ);
      champEl.querySelector(".note").textContent = e.note;
    } else {
      champEl.className = "";
      champEl.innerHTML = "";
    }

    drawLines();
  }

  // ---------- View switching ----------
  // view: "log" (list of tournaments), "setup" (entries) or "bracket"
  function show(view) {
    const inLog = view === "log";
    const bracket = view === "bracket";
    document.getElementById("log").classList.toggle("hidden", !inLog);
    document.getElementById("setup").classList.toggle("hidden", view !== "setup");
    document.getElementById("bracketView").classList.toggle("hidden", !bracket);
    document.getElementById("back").classList.toggle("hidden", inLog);
    document.getElementById("title").textContent = inLog ? "Tournaments" : displayName(state);
    document.getElementById("sub").textContent = inLog
      ? "Your saved tournaments. Open one to keep going, or start a new one."
      : bracket
        ? "Click an entry to advance it. Click the winner again to undo."
        : `Add ${MIN_ENTRIES}-${MAX_ENTRIES} entries (name, optional note and photo). Entry 1 is the top seed; if the count isn't a power of two, the top seeds get byes.`;
    if (inLog) {
      renderLog();
    } else if (bracket) {
      renderBracket();
      // Wide brackets scroll sideways: start with the Final in view instead of the left edge.
      const el = document.getElementById("bracket");
      el.scrollLeft = Math.max(0, (el.scrollWidth - el.clientWidth) / 2);
    } else {
      renderSetup();
    }
  }

  // ---------- Tournament log ----------
  // Summarize any tournament (not just the open one) by pointing `state` at it for a moment.
  function summarize(t) {
    const prev = state;
    state = t;
    try {
      const n = t.entries.length;
      const info = { n, status: "Setting up", champion: null };
      if (t.started && t.builtN === n) {
        const L = layout();
        const champ = winner(L, L.rounds - 1, 0);
        const played = t.picks.reduce((sum, round) => sum + round.filter(v => v !== null).length, 0);
        if (champ !== null) {
          info.status = "Finished";
          info.champion = entryLabel(champ);
        } else {
          info.status = played === 0 ? "Bracket ready" : `${played} of ${n - 1} matches played`;
        }
      }
      return info;
    } finally {
      state = prev;
    }
  }

  function formatWhen(ts) {
    try {
      return new Date(ts).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    } catch (e) { return ""; }
  }

  function renderLog() {
    const list = document.getElementById("tlist");
    list.innerHTML = "";
    if (!db.tournaments.length) {
      const empty = document.createElement("div");
      empty.className = "empty-log";
      empty.textContent = 'No tournaments yet. Click "New tournament" to create your first bracket.';
      list.appendChild(empty);
      return;
    }
    [...db.tournaments].sort((a, b) => b.updated - a.updated).forEach(t => {
      const info = summarize(t);
      const card = document.createElement("div");
      card.className = "tcard";
      card.dataset.id = t.id;
      card.innerHTML = `
        <div class="tinfo">
          <div class="tname"></div>
          <div class="tchamp hidden"></div>
          <div class="tmeta"></div>
        </div>
        <div class="tbtns">
          <button class="open">Open</button>
          <button class="danger del">Delete</button>
        </div>`;
      // textContent (not innerHTML) so typed names can't inject markup
      card.querySelector(".tname").textContent = displayName(t);
      if (info.champion) {
        const champ = card.querySelector(".tchamp");
        champ.textContent = `Champion: ${info.champion}`;
        champ.classList.remove("hidden");
      }
      card.querySelector(".tmeta").textContent =
        `${info.n} entries · ${info.status} · Updated ${formatWhen(t.updated)}`;

      card.addEventListener("click", (ev) => {
        if (!ev.target.closest("button")) openTournament(t.id);
      });
      card.querySelector(".open").addEventListener("click", () => openTournament(t.id));
      card.querySelector(".del").addEventListener("click", () => {
        deleteTournament(t.id);
        renderLog();
      });
      list.appendChild(card);
    });
  }

  function openTournament(id) {
    const t = db.tournaments.find(x => x.id === id);
    if (!t) return;
    state = t;
    db.openId = id;
    save(false);
    show(t.started && t.builtN === t.entries.length ? "bracket" : "setup");
  }

  // A tournament that was created but never touched shouldn't clutter the log.
  function isPristine(t) {
    return !t.started && !t.nameEdited && t.entries.every(e => !e.name && !e.note && !e.photo);
  }

  function goHome() {
    if (state && isPristine(state)) db.tournaments = db.tournaments.filter(t => t !== state);
    state = null;
    db.openId = null;
    save(false);
    show("log");
  }

  // Asks first. Returns true if it was deleted.
  function deleteTournament(id) {
    const t = db.tournaments.find(x => x.id === id);
    if (!t) return false;
    if (!confirm(`Delete "${displayName(t)}"? This can't be undone.`)) return false;
    db.tournaments = db.tournaments.filter(x => x.id !== id);
    if (db.openId === id) db.openId = null;
    if (state && state.id === id) state = null;
    save(false);
    return true;
  }

  addBtn.addEventListener("click", () => {
    if (state.entries.length >= MAX_ENTRIES) return;
    state.entries.push(blankEntry());
    entriesChanged();
    renderSetup();
    const inputs = slotsEl.querySelectorAll('.slot input[type="text"]');
    if (inputs.length >= 2) inputs[inputs.length - 2].focus(); // new row's name field
  });

  document.getElementById("generate").addEventListener("click", () => {
    const n = state.entries.length;
    const filled = state.entries.filter(e => e.name.trim()).length;
    if (filled < n && !confirm(`Only ${filled} of ${n} entries have names. Continue anyway?`)) return;
    if (state.builtN !== n) {
      state.picks = buildPicks(nextPow2(n));
      state.builtN = n;
    }
    state.started = true;
    save();
    show("bracket");
  });

  document.getElementById("fill").addEventListener("click", () => {
    // Full NATO alphabet (26); past that it wraps with a number: Alpha 2, Bravo 2, ...
    const nato = [
      "Alpha", "Bravo", "Charlie", "Delta", "Echo", "Foxtrot", "Golf", "Hotel", "India",
      "Juliet", "Kilo", "Lima", "Mike", "November", "Oscar", "Papa", "Quebec", "Romeo",
      "Sierra", "Tango", "Uniform", "Victor", "Whiskey", "X-ray", "Yankee", "Zulu",
    ];
    state.entries.forEach((e, i) => {
      if (!e.name) {
        const lap = Math.floor(i / nato.length);
        e.name = nato[i % nato.length] + (lap ? ` ${lap + 1}` : "");
      }
    });
    save();
    renderSetup();
  });

  document.getElementById("edit").addEventListener("click", () => show("setup"));

  document.getElementById("clearPicks").addEventListener("click", () => {
    state.picks = buildPicks(layout().p);
    save();
    renderBracket();
  });

  document.getElementById("newTournament").addEventListener("click", () => {
    openTournament(createTournament().id);
  });

  document.getElementById("back").addEventListener("click", goHome);

  document.getElementById("deleteCurrent").addEventListener("click", () => {
    if (state && deleteTournament(state.id)) show("log");
  });

  document.getElementById("tname").addEventListener("input", (ev) => {
    if (!state) return;
    state.name = ev.target.value;
    state.nameEdited = true;
    document.getElementById("title").textContent = displayName(state);
    save();
  });

  window.addEventListener("resize", drawLines);

  // ---------- Init ----------
  // Pick up where you left off if a tournament was open, otherwise show the log.
  if (db.openId) openTournament(db.openId); else show("log");
</script>
</body>
</html>
